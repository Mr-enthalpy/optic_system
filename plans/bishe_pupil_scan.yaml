plan_id: bishe_pupil_scan

camera_params_source: outputs/exposure_calibration/camera_params_psf_safe.json

wavelength:
  wavelength_nm: 550.0
  grating: 1
  settle_ms: 1000

lcd:
  settle_ms: 200
  mode: procedural_scan
  physical_shape: null
  subpixel_axis: null

scan:
  scan_modes: [bars_x, bars_y, blocks]
  active_code: 255
  background_code: 0
  bar_count: 40
  bar_width: null
  block_rows: 20
  block_cols: 20
  include_baselines: true
  store_physical_masks: false

camera:
  frames_per_capture: null

analysis_hint:
  response_metric: robust_energy
  threshold_fraction: 0.5
  margin_fraction: 0.05

lock_file: outputs/run_status/capture_hardware.lock

output:
  raw_h5: data/raw/bishe_pupil_scan.h5
  output_dir: outputs/pupil_scan
