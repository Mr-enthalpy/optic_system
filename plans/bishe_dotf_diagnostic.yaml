# Phase 3.3 - dOTF diagnostic visualization (PLANNED STUB)
#
# Purpose: capture reference and edge-perturbed PSF pairs for direct
# dOTF visualization.  Refer to docs/bishe_plan.md for the full specification.
#
# This is a schema sketch.  The plan is not yet executable.

plan_id: bishe_dotf_diagnostic
phase: "3.3"

camera_params_source: outputs/exposure_calibration/camera_params_psf_safe.json
camera_profile: canonical_low_gain
pupil_window_source: outputs/pupil_geometry/effective_pupil_window.json
psf_roi_source: outputs/psf_roi/psf_roi.json

wavelength:
  wavelength_nm: 550.0
  grating: 1

dotf:
  perturbation: edge_local_block
  repeats: 20
  frames_per_capture: 10
  normalize_energy: true

output:
  raw_h5: data/raw/bishe_dotf_diagnostic.h5
  output_dir: outputs/dotf
