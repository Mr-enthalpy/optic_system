plan_id: bishe_psf_safe_exposure

wavelengths:
  - wavelength_nm: 450.0
    grating: 1
    settle_ms: 1000
  - wavelength_nm: 550.0
    grating: 1
    settle_ms: 1000
  - wavelength_nm: 650.0
    grating: 1
    settle_ms: 1000

lcd:
  mode: all_open
  mask_path: null
  settle_ms: 200

camera:
  # Dry-run fallback only. Canonical hardware runs require frame stream
  # pixel-format metadata to resolve frame_dtype_full_scale.
  full_scale: 255

camera_search:
  # exposure_us_start must be set to the MAXIMUM exposure you are willing to try
  # (the search upper bound).  The sweep starts at this ceiling and descends
  # by step_factor until reaching exposure_us_min or finding a safe exposure.
  exposure_us_start: 50000
  exposure_us_min: 100
  # Phase 1 uses binary search per wavelength.  Search stops when the
  # exposure interval is narrower than binary_search_eps_us (microseconds).
  binary_search_eps_us: 50.0
  exposure_us_step_factor: 0.5
  gain_db_start: 0.0
  gain_db_min: 0.0
  gain_db_max: 24.0
  gain_db_step_db: 3.0
  frames_per_setting: 5

psf_safety:
  rule: all_frames_all_pixels_strictly_below_full_scale

diagnostics:
  percentiles: [99.0, 99.9]

signal:
  percentile: 99.0
  min_signal_fraction_threshold: 0.10
  min_dynamic_range_fraction: 0.08

lock_file: outputs/run_status/capture_hardware.lock

output:
  raw_h5: data/raw/bishe_psf_safe_exposure.h5
  camera_params_json: outputs/exposure_calibration/camera_params_psf_safe.json
