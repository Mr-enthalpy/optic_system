plan_id: bishe_psf_repeatability
phase: "3.2b"

camera_params_source: outputs/exposure_calibration/camera_params_psf_safe.json

pupil_window_source: outputs/pupil_geometry/effective_pupil_window.json
psf_roi_source: outputs/psf_roi/psf_roi.json

wavelength:
  wavelength_nm: 550.0
  grating: 1
  settle_ms: 500

lcd:
  display_index: 1
  subpixel_axis: 1
  settle_ms: 200

capture:
  repeats_per_mask: 10
  frames_per_capture: 10

masks:
  set: representative_low_frequency
  include:
    - all_open_window
    - vertical_stripes_lowfreq
    - horizontal_stripes_lowfreq
    - checkerboard_lowfreq
    - central_block
    - edge_block
    - random_lowfreq_1
    - random_lowfreq_2

output:
  raw_h5: data/raw/bishe_psf_repeatability.h5
  output_dir: outputs/psf_repeatability

lock_file: outputs/run_status/capture_hardware.lock
