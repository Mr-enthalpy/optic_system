plan_id: bishe_dotf_diagnostic_rerun_20260520_004205
phase: "3.3"

camera_params_source: outputs/exposure_calibration/camera_params_psf_safe.json
camera_profile_policy: wavelength_recommended

pupil_window_source: outputs/pupil_geometry/effective_pupil_window.json
psf_roi_source: outputs/psf_roi/psf_roi.json

wavelengths:
  - wavelength_nm: 450.0
    grating: 1
    settle_ms: 500
  - wavelength_nm: 550.0
    grating: 1
    settle_ms: 500
  - wavelength_nm: 650.0
    grating: 1
    settle_ms: 500

lcd:
  display_index: 1
  subpixel_axis: 1
  settle_ms: 200

capture:
  repeats: 20
  frames_per_capture: 10

dotf:
  roi_keys:
    - roi_256
    - roi_512
    - roi_768
    - roi_1024

  perturbation_set:
    - edge_block_left
    - edge_block_right
    - edge_block_top
    - edge_block_bottom

  perturbation:
    type: local_edge_occlusion
    size_px: 8
    offset_from_effective_radius_px: 0
    code_inside_reference: 255
    code_perturbation: 0
    background_code: 0

  normalize_energy: true
  align_before_fft: true
  window_before_fft: false

  edge_energy:
    enabled: true
    edge_band_px: 10

output:
  raw_h5: data/raw/bishe_dotf_diagnostic_20260520_004205.h5
  output_dir: outputs/dotf_20260520_004205

lock_file: outputs/run_status/capture_hardware.lock

